allow-lan: false
ipv6: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat"
  geosite: "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: redir-host
  respect-rules: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query

sniffer:
  enable: true
#  force-dns-mapping: true
#  parse-pure-ip: true
#  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
#      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443

port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - "udp://any:53"
    - "tcp://any:53"
  strict-route: true

proxy-providers:
  provider1:
    type: file
    path: ./provider1.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 300
  provider2:
    type: http
    url: https://raw.githubusercontent.com/peasoft/NoMoreWalls/refs/heads/master/list.meta.yml
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 300



proxy-groups:
- name: PROXY
  type: select
  proxies: [新加坡,美国,香港,台湾,日本,其它,DIRECT]
  url: https://cp.cloudflare.com
  interval: 300
- name: 新加坡
  type: url-test
  include-all: true
  exclude-type: direct
  filter: "(?i)(新加坡|sg|singapore)"
  url: https://cp.cloudflare.com
  interval: 300
- name: 美国
  type: url-test
  include-all: true
  exclude-type: direct
  filter: "(?i)(美国|us|unitedstates|united states)"
  url: https://cp.cloudflare.com
  interval: 300
- name: 香港
  type: url-test
  include-all: true
  exclude-type: direct
  filter: "(?i)(香港|hk|hongkong|hong kong)"
  url: https://cp.cloudflare.com
  interval: 300
- name: 台湾
  type: url-test
  include-all: true
  exclude-type: direct
  filter: "(?i)(台湾|tw|taiwan)"
  url: https://cp.cloudflare.com
  interval: 300
- name: 日本
  type: url-test
  include-all: true
  exclude-type: direct
  filter: "(?i)(日本|jp|japan)"
  url: https://cp.cloudflare.com
  interval: 300
- name: 其它
  type: select
  include-all: true
  exclude-type: direct
  filter: "(?i)^(?!.*(?:新加坡|sg|singapore|美国|us|unitedstates|united states|香港|hk|hongkong|hong kong|台湾|tw|taiwan|日本|jp|japan)).*"
  url: https://cp.cloudflare.com
  interval: 300

rules:
- GEOSITE,category-ads-all,REJECT
- GEOSITE,private,DIRECT
- GEOSITE,googlefcm,DIRECT
- RULE-SET,gfw,PROXY
- RULE-SET,category-games@cn,DIRECT
# - GEOSITE,google,PROXY
# - GEOSITE,tiktok,PROXY
- GEOSITE,geolocation-!cn@cn,DIRECT
- GEOSITE,geolocation-!cn,PROXY
- GEOSITE,cn@!cn,PROXY
- GEOSITE,cn,DIRECT

- GEOIP,private,DIRECT,no-resolve
- GEOIP,cn,DIRECT
- RULE-SET,telegram_ip,PROXY

- MATCH,DIRECT

rule-providers:
  category-games@cn:
    type: http
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games@cn.mrs
    interval: 86400
    behavior: domain
    format: mrs
  gfw:
    type: http
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs
    interval: 86400
    behavior: domain
    format: mrs

  telegram_ip:
    type: http
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs
    interval: 86400
    behavior: ipcidr
    format: mrs



    
